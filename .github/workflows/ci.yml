name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"

jobs:
  test-backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medtrack_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/medtrack_test
      JWT_SECRET: ci-jwt-secret-not-used-in-prod
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-not-used-in-prod
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medtrack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: "11.17.0"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        working-directory: backend
        run: python -m pip install -r tests/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        working-directory: backend
        run: pnpm prisma migrate deploy

      - name: Generate Prisma client
        working-directory: backend
        run: pnpm prisma generate

      - name: Generate gRPC TypeScript client
        working-directory: backend
        run: pnpm run generate:proto

      - name: Lint changed backend TypeScript files
        working-directory: backend
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            diff_range="origin/$BASE_REF...HEAD"
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            diff_range="$BEFORE_SHA $HEAD_SHA"
          else
            diff_range="$(git rev-list --max-parents=0 HEAD) $HEAD_SHA"
          fi

          mapfile -t files < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=ACMR $diff_range -- \
              'backend/src/**/*.ts' 'backend/apps/**/*.ts' 'backend/libs/**/*.ts' 'backend/test/**/*.ts' |
              sed 's#^backend/##'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No backend TypeScript files changed; skipping incremental lint."
            exit 0
          fi

          pnpm exec eslint --no-fix "${files[@]}"

      - name: Type check
        working-directory: backend
        run: pnpm tsc --noEmit

      - name: Unit tests
        working-directory: backend
        run: python -m pytest tests -m "not integration"

      - name: E2E tests
        working-directory: backend
        run: pnpm run test:e2e

  test-frontend:
    name: Frontend — lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: "10.28.1"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        working-directory: frontend
        run: python -m pip install -r tests/requirements.txt

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Type check
        working-directory: frontend
        run: pnpm run type-check 

      - name: Tests
        working-directory: frontend
        run: pnpm run test:ci

  test-rust:
    name: Rust analytics — fmt, clippy, test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medtrack_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/medtrack_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medtrack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: "11.17.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations for Rust checks
        working-directory: backend
        run: pnpm prisma migrate deploy

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust_analytics/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_analytics/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Format code (auto)
        working-directory: rust_analytics
        run: cargo fmt --all

      - name: Clippy
        working-directory: rust_analytics
        run: cargo clippy -- -D warnings

      - name: Tests
        working-directory: rust_analytics
        run: cargo test

  docker-build-check:
    name: Docker build smoke check (no push)
    runs-on: ubuntu-latest
    # Only run on PRs targeting main — saves minutes on every branch push
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: ./backend/Dockerfile
            target: final
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: final
          - service: rust-analytics
            context: .
            dockerfile: ./rust_analytics/Dockerfile
            target: ""

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            protos=./protos
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
