name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  OWNER: pkowech

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & push backend image → GHCR
  # ──────────────────────────────────────────────
  build-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      image: ghcr.io/pkowech/medtrack-backend:sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/medtrack-backend:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/medtrack-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ──────────────────────────────────────────────
  # 2. Build & push rust-analytics image → GHCR
  # ──────────────────────────────────────────────
  build-rust:
    name: Build & push rust-analytics image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      image: ghcr.io/pkowech/medtrack-rust-analytics:sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rust_analytics/Dockerfile
          build-contexts: |
            protos=./protos
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/medtrack-rust-analytics:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/medtrack-rust-analytics:latest
          cache-from: type=gha,scope=rust-analytics
          cache-to: type=gha,mode=max,scope=rust-analytics

  # ──────────────────────────────────────────────
  # 3. Deploy frontend → Vercel
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    env:
      PNPM_VERSION: "10.28.1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Pull Vercel environment
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Build for Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: vercel build --prod --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: vercel deploy --prebuilt --prod --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

  # ──────────────────────────────────────────────
  # 4. Prisma migrations (before backend goes live)
  # ──────────────────────────────────────────────
  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event.workflow_run.conclusion == 'success'
    env:
      PNPM_VERSION: "11.17.0"
      DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL || secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.AIVEN_DIRECT_URL || secrets.DIRECT_URL || secrets.AIVEN_DATABASE_URL || secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Validate database configuration
        run: |
          for name in DATABASE_URL DIRECT_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Set AIVEN_DATABASE_URL (or DATABASE_URL) and AIVEN_DIRECT_URL (or DIRECT_URL) in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: backend
        run: pnpm prisma generate

      - name: Run migrations
        working-directory: backend
        run: pnpm prisma migrate deploy

  # ──────────────────────────────────────────────
  # 5. Deploy backend container → Render
  #    Uses Render's PATCH /services/:id endpoint to
  #    update the image, then POSTs a deploy trigger.
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → Render
    runs-on: ubuntu-latest
    needs: [build-backend, migrate]
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Validate Render configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
          RENDER_GHCR_CRED_ID: ${{ secrets.RENDER_GHCR_CRED_ID }}
        run: |
          for name in RENDER_API_KEY RENDER_SERVICE_ID RENDER_GHCR_CRED_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for backend deployment: $name"
              exit 1
            fi
          done

      - name: Update image
        env:
          IMAGE: ${{ needs.build-backend.outputs.image }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
          RENDER_GHCR_CRED_ID: ${{ secrets.RENDER_GHCR_CRED_ID }}
        run: |
          payload=$(jq -cn --arg image "$IMAGE" --arg credential "$RENDER_GHCR_CRED_ID" \
            '{image:{url:$image,credentials:{registryCredentialId:$credential}}}')
          curl --fail-with-body --silent --show-error -X PATCH "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$payload"

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{}"

  # ──────────────────────────────────────────────
  # 6. Deploy rust-analytics container → Render
  # ──────────────────────────────────────────────
  deploy-rust:
    name: Deploy rust-analytics → Render
    runs-on: ubuntu-latest
    needs: build-rust
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Validate Render configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_RUST }}
          RENDER_GHCR_CRED_ID: ${{ secrets.RENDER_GHCR_CRED_ID }}
        run: |
          for name in RENDER_API_KEY RENDER_SERVICE_ID RENDER_GHCR_CRED_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for Rust deployment: $name"
              exit 1
            fi
          done

      - name: Update image
        env:
          IMAGE: ${{ needs.build-rust.outputs.image }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_RUST }}
          RENDER_GHCR_CRED_ID: ${{ secrets.RENDER_GHCR_CRED_ID }}
        run: |
          payload=$(jq -cn --arg image "$IMAGE" --arg credential "$RENDER_GHCR_CRED_ID" \
            '{image:{url:$image,credentials:{registryCredentialId:$credential}}}')
          curl --fail-with-body --silent --show-error -X PATCH "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$payload"

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_RUST }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{}"

  # ──────────────────────────────────────────────
  # 7. Smoke tests
  # ──────────────────────────────────────────────
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, deploy-rust]
    if: |
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.deploy-frontend.result == 'success' &&
      needs.deploy-backend.result == 'success' &&
      needs.deploy-rust.result == 'success'

    steps:
      - name: Wait for services to start
        run: sleep 40

      - name: Validate health-check configuration
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          FRONTEND_HEALTH_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
          RUST_HEALTH_URL: ${{ secrets.RUST_HEALTH_URL }}
        run: |
          for name in BACKEND_HEALTH_URL FRONTEND_HEALTH_URL RUST_HEALTH_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Backend health check
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_HEALTH_URL")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Backend healthy"; exit 0
            fi
            sleep 20
          done
          echo "Backend health check failed" >&2; exit 1

      - name: Frontend health check
        env:
          FRONTEND_HEALTH_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_HEALTH_URL")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Frontend healthy"; exit 0
            fi
            sleep 20
          done
          echo "Frontend health check failed" >&2; exit 1

      - name: Rust analytics health check
        env:
          RUST_HEALTH_URL: ${{ secrets.RUST_HEALTH_URL }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RUST_HEALTH_URL")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Rust analytics healthy"; exit 0
            fi
            sleep 20
          done
          echo "Rust analytics health check failed" >&2; exit 1
