<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <title>Offline - MedTrack Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 600px;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .button {
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .button:hover {
            background-color: #1d4ed8;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            background-color: #fee2e2;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📶</div>
        <h1>Page Unavailable</h1>
        <p>This page could not be loaded. Previously saved learning content may still be available on this device.</p>
        <p>Queued progress will sync when the app is open and your connection is restored.</p>
        <button class="button" type="button" onclick="window.location.reload()">Try Again</button>
        <div class="status" id="status" aria-live="polite">Reconnecting automatically when this page is reachable...</div>
    </div>

    <script>
        const status = document.getElementById('status');
        let recoveryInProgress = false;

        function updateStatus(message, backgroundColor, color) {
            status.textContent = message;
            status.style.backgroundColor = backgroundColor;
            status.style.color = color;
        }

        async function retryPageWhenReachable() {
            if (recoveryInProgress) return;
            recoveryInProgress = true;

            const controller = new AbortController();
            const timeout = window.setTimeout(() => controller.abort(), 5000);
            try {
                const response = await fetch(window.location.href, {
                    method: 'HEAD',
                    cache: 'no-store',
                    credentials: 'same-origin',
                    signal: controller.signal
                });
                if (response.ok) {
                    updateStatus('Connection restored. Reloading this page...', '#dcfce7', '#16a34a');
                    window.location.reload();
                } else {
                    updateStatus('Still unable to reach this page. Retrying automatically...', '#fee2e2', '#dc2626');
                }
            } catch {
                updateStatus('Still unable to reach this page. Retrying automatically...', '#fee2e2', '#dc2626');
            } finally {
                window.clearTimeout(timeout);
                recoveryInProgress = false;
            }
        }

        window.addEventListener('online', retryPageWhenReachable);
        window.addEventListener('offline', () => {
            updateStatus(
                'Connection lost. Retrying automatically when it returns...',
                '#fee2e2',
                '#dc2626'
            );
        });
        void retryPageWhenReachable();
        window.setInterval(retryPageWhenReachable, 10000);
    </script>
</body>
</html>
