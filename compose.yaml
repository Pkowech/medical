services:
   backend:
    build:
      # Build from the repository root so backend can access shared root-level
      # proto definitions under ./protos without requiring a separate backend
      # copy or root-level context workaround.
      context: .
      dockerfile: backend/Dockerfile
      target: final
      args:
        DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
        SQLX_OFFLINE: ${SQLX_OFFLINE:-true}
    container_name: medtrack_backend_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      POSTGRES_HOST: postgres
      REDIS_HOST: ${REDIS_HOST}
      # DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT_SECRET and NEXTAUTH_SECRET now come from .env (git-ignored),
      # like every other secret here. They were previously hardcoded to the
      # SAME literal value directly in this file — both a leaked-secret risk
      # (if this file is committed) and a design issue (a leak of one secret
      # would compromise the other too, since they were identical). Generate
      # two SEPARATE values, e.g. `openssl rand -base64 32`, and rotate
      # whatever's currently deployed with the old hardcoded value.
      JWT_SECRET: ${JWT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ANALYTICS_GRPC_URL: ${ANALYTICS_GRPC_URL:-rust-analytics:50051}
      RUST_ANALYTICS_GRPC_URL: ${RUST_ANALYTICS_GRPC_URL:-rust-analytics:50051}
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-medtrack}
    command: >
      sh -c "pnpm prisma migrate deploy && node dist/src/main.js"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    # Updated healthcheck to use Node.js (no curl dependency)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${BACKEND_PORT}/api/health', (res) => { if (res.statusCode === 200) process.exit(0); process.exit(1); })\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medtrack_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

   rust-analytics:
    build:
      # Build from the Rust crate directory and supply shared protos as an
      # additional context for the Dockerfile's bind mounts.
      context: ./rust_analytics
      dockerfile: Dockerfile
      additional_contexts:
        protos: ./protos
      args:
        SQLX_OFFLINE: ${SQLX_OFFLINE:-true}
    container_name: medtrack_rust_analytics_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUST_ANALYTICS_GRPC_HOST: 0.0.0.0
      RUST_ANALYTICS_GRPC_PORT: 50051
      RUST_ANALYTICS_HOST: 0.0.0.0
      RUST_ANALYTICS_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      RUST_ANALYTICS_API_KEY: ${RUST_ANALYTICS_API_KEY:?RUST_ANALYTICS_API_KEY must be set}
    ports:
      - "50051:50051"
      - "8000:8000"
    networks:
      - medtrack_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Switched from CMD-SHELL to exec-form CMD. The rust-analytics image now
      # runs on a distroless base with NO shell (see rust_analytics/Dockerfile),
      # so a CMD-SHELL healthcheck (which needs /bin/sh to run) would fail
      # outright. Exec form calls the binary directly, no shell required.
      test: ["CMD", "/usr/local/bin/rust_analytics", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

   prometheus:
    image: prom/prometheus:v2.47.0
    container_name: medtrack_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - medtrack_net
    depends_on:
      - backend

   alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: medtrack_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--web.external-url=http://localhost:9093'
    networks:
      - medtrack_net
    depends_on:
      - prometheus

   grafana:
    image: grafana/grafana:10.1.5
    container_name: medtrack_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    networks:
      - medtrack_net
    depends_on:
      - prometheus
  
   gotenberg:
    image: gotenberg/gotenberg:8
    container_name: medtrack_gotenberg
    restart: unless-stopped
    ports:
      - "3010:3000"
    networks:
      - medtrack_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  medtrack_net:
    driver: bridge

secrets:
  nextauth_secret:
    file: ./secrets/nextauth_secret.txt