services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: final
      args:
        DATABASE_URL: ${DATABASE_URL}
        SQLX_OFFLINE: ${SQLX_OFFLINE:-true}

    container_name: medtrack_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3002}
      HOSTNAME: 0.0.0.0

      # === Online External Services (Neon + Upstash) ===
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL}
      ENABLE_REDIS: "true"
      ENABLE_GRPC: "true"
      ANALYTICS_GRPC_URL: 127.0.0.1:50051
      RUST_ANALYTICS_GRPC_URL: 127.0.0.1:50051

      # Auth & Secrets
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # Rust analytics runs in this same container; its gRPC listener remains private.
      RUST_ANALYTICS_API_KEY: ${RUST_ANALYTICS_API_KEY:?Set RUST_ANALYTICS_API_KEY}
      RUST_ANALYTICS_GRPC_HOST: 0.0.0.0
      RUST_ANALYTICS_GRPC_PORT: "50051"
      RUST_ANALYTICS_HOST: 0.0.0.0
      RUST_ANALYTICS_PORT: "8000"

      # File Storage
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-medtrack}

      # PDF generation
      GOTENBERG_URL: http://gotenberg:3000

    ports:
      - "${BACKEND_PORT:-3002}:${BACKEND_PORT:-3002}"

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${BACKEND_PORT:-3002}/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); })\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - medtrack_net


  # ===================== Local Development Only =====================

  postgres:
    image: postgres:16-alpine
    container_name: medtrack_postgres
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medtrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medtrack_redis
    profiles: ["dev"]
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: medtrack_gotenberg
    restart: unless-stopped
    ports:
      - "3010:3000"
    networks:
      - medtrack_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  medtrack_net:
    driver: bridge