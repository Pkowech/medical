services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: final
      args:
        DATABASE_URL: ${DATABASE_URL}
        SQLX_OFFLINE: ${SQLX_OFFLINE:-true}

    container_name: medtrack_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}

      # === Render-style External Services ===
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      # Auth & Secrets
      JWT_SECRET: ${JWT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # Other services
      ANALYTICS_GRPC_URL: ${ANALYTICS_GRPC_URL:-rust-analytics:50051}
      RUST_ANALYTICS_GRPC_URL: ${RUST_ANALYTICS_GRPC_URL:-rust-analytics:50051}

      # File Storage
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-medtrack}

    command: >
      sh -c "pnpm prisma migrate deploy && node dist/src/main.js"

    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${BACKEND_PORT:-3000}/api/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); })\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      rust-analytics:
        condition: service_healthy

    networks:
      - medtrack_net


  rust-analytics:
    build:
      context: ./rust_analytics
      dockerfile: Dockerfile
      additional_contexts:
        protos: ./protos
      args:
        SQLX_OFFLINE: ${SQLX_OFFLINE:-true}

    container_name: medtrack_rust_analytics
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_ANALYTICS_API_KEY: ${RUST_ANALYTICS_API_KEY}

      RUST_ANALYTICS_GRPC_HOST: 0.0.0.0
      RUST_ANALYTICS_GRPC_PORT: 50051
      RUST_ANALYTICS_HOST: 0.0.0.0
      RUST_ANALYTICS_PORT: 8000

    ports:
      - "50051:50051"
      - "8000:8000"

    networks:
      - medtrack_net

    healthcheck:
      test: ["CMD", "/usr/local/bin/rust_analytics", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # ===================== Local Development Only =====================

  postgres:
    image: postgres:16-alpine
    container_name: medtrack_postgres
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medtrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medtrack_redis
    profiles: ["dev"]
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      retries: 5

  # Monitoring services (unchanged)
  prometheus:
    image: prom/prometheus:v2.47.0
    # ... (keep as before)

  alertmanager:
    image: prom/alertmanager:v0.26.0
    # ... (keep as before)

  grafana:
    image: grafana/grafana:10.1.5
    # ... (keep as before)

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "3010:3000"
    networks:
      - medtrack_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  medtrack_net:
    driver: bridge