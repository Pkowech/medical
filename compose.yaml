services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: final
      args:
        DATABASE_URL: ${DATABASE_URL}
        SQLX_OFFLINE: ${SQLX_OFFLINE:-true}

    container_name: medtrack_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3002}

      # === Online External Services (Neon + Upstash) ===
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL}
      ENABLE_REDIS: "true"

      # Auth & Secrets
      JWT_SECRET: ${JWT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # gRPC connection to rust-analytics sidecar (service name resolves in Docker network)
      ANALYTICS_GRPC_URL: ${ANALYTICS_GRPC_URL:-rust-analytics:50051}
      RUST_ANALYTICS_GRPC_URL: ${RUST_ANALYTICS_GRPC_URL:-rust-analytics:50051}

      # File Storage
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-medtrack}

      # PDF generation
      GOTENBERG_URL: http://gotenberg:3000

    # NOTE: The Dockerfile CMD already runs prisma migrate deploy + node dist/src/main
    # No command override needed here — the final image handles it correctly.

    ports:
      - "${BACKEND_PORT:-3002}:${BACKEND_PORT:-3002}"

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${BACKEND_PORT:-3002}/api/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); })\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    depends_on:
      rust-analytics:
        condition: service_healthy

    networks:
      - medtrack_net


  rust-analytics:
    build:
      context: .
      dockerfile: rust_analytics/Dockerfile
      additional_contexts:
        protos: ./protos
      args:
        SQLX_OFFLINE: ${SQLX_OFFLINE:-true}

    container_name: medtrack_rust_analytics
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Neon online DB
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RUST_ANALYTICS_API_KEY: ${RUST_ANALYTICS_API_KEY}

      RUST_ANALYTICS_GRPC_HOST: 0.0.0.0
      RUST_ANALYTICS_GRPC_PORT: 50051
      RUST_ANALYTICS_HOST: 0.0.0.0
      RUST_ANALYTICS_PORT: 8000

    ports:
      - "50051:50051"
      - "8000:8000"

    networks:
      - medtrack_net

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # ===================== Local Development Only =====================

  postgres:
    image: postgres:16-alpine
    container_name: medtrack_postgres
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medtrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medtrack_redis
    profiles: ["dev"]
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: medtrack_gotenberg
    restart: unless-stopped
    ports:
      - "3010:3000"
    networks:
      - medtrack_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  medtrack_net:
    driver: bridge